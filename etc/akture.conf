# akture.conf(5): configuration of the akture display manager.
#
# Lines are "key = value".  Only lines that start with '#' are
# comments; a '#' later in a line is part of the value (#RRGGBB).
# The values shown are the defaults.

# Background: name of the .akbg files in /usr/share/akture/backgrounds,
# i.e. "name" selects name-1366x768.akbg on a 1366x768 output.
# Without one, or where no file fits, background_color is used.
#background = autumn
#background_color = #1E1410

#accent = #C8441B
#text_color = #F5EFE4

# Fonts are given by path; fontconfig is not used.
#font_ui = /usr/share/akture/fonts/Outfit.ttf
#font_clock = /usr/share/akture/fonts/ZenKakuGothicNew-Light.ttf
#clock_format = %H:%M

# Logo in the lower right corner; text between ** is bold.
#show_logo = yes
#logo = **Autumn**BSD

# Scale factor: 1, 1.25, 1.5 or 2.
#scale = 1

# Layouts to switch between, e.g. "jp,us".  Empty: those of the X server.
#keyboard_layouts =

# Session file name or name from /etc/akture/sessions.  Empty: the first.
#default_session =
#prefer_xsession = no

#remember_user = yes
#allow_power = yes

# Log this user in at boot without asking (akture-autologin PAM service).
#autologin_user =

#x_server = /usr/X11R7/bin/X
#x_args = -nolisten tcp
